name: Publish Viper Push Relay image

on:
  push:
    branches:
      - develop
      - uno
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: viper-push-relay-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REPO: ghcr.io/viperteccorporation/viper-push-relay

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/viper-push-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/viper-push-relay/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/viper-push-relay
          file: services/viper-push-relay/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=viper-push-relay-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=viper-push-relay-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: viper-push-relay-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: viper-push-relay-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          sanitized_ref=$(echo "$GIT_REF" | sed 's/\//-/g')
          tags=("-t" "${DOCKER_REPO}:${sanitized_ref}")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags+=("-t" "${DOCKER_REPO}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf '${{ env.DOCKER_REPO }}@sha256:%s ' *)

      - name: Inspect image
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          sanitized_ref=$(echo "$GIT_REF" | sed 's/\//-/g')
          docker buildx imagetools inspect "${DOCKER_REPO}:${sanitized_ref}"
