apply plugin: 'com.android.application'

def releaseSigningValues = [:]
def releaseSigningEnvironmentFile = [
    System.getenv('VIPERCHAT_UPLOAD_ENV_FILE'),
    System.getenv('USERPROFILE') ? "${System.getenv('USERPROFILE')}\\.android\\keystores\\.env" : null,
    "${System.getProperty('user.home')}/.android/keystores/.env"
].find { candidate -> candidate && new File(candidate).isFile() }

if (releaseSigningEnvironmentFile) {
    new File(releaseSigningEnvironmentFile).eachLine { line ->
        def normalizedLine = line.trim()
        if (normalizedLine && !normalizedLine.startsWith('#') && normalizedLine.contains('=')) {
            def separator = normalizedLine.indexOf('=')
            releaseSigningValues[normalizedLine.substring(0, separator)] = normalizedLine.substring(separator + 1)
        }
    }
}

def releaseSigningValue = { name ->
    System.getenv(name) ?: releaseSigningValues[name]
}
def releaseSigningKeys = [
    'VIPERCHAT_UPLOAD_KEYSTORE',
    'VIPERCHAT_UPLOAD_KEY_ALIAS',
    'VIPERCHAT_UPLOAD_STORE_PASSWORD',
    'VIPERCHAT_UPLOAD_KEY_PASSWORD'
]
def missingReleaseSigningKeys = releaseSigningKeys.findAll { !releaseSigningValue(it) }
def releaseSigningConfigured = missingReleaseSigningKeys.isEmpty()
def releaseSigningStoreFile = null

if (releaseSigningConfigured) {
    def releaseSigningStorePath = releaseSigningValue('VIPERCHAT_UPLOAD_KEYSTORE')
    if (File.separator == '/' && releaseSigningStorePath ==~ /^[A-Za-z]:[\\\/].*/) {
        def drive = releaseSigningStorePath.substring(0, 1).toLowerCase()
        def relativePath = releaseSigningStorePath.substring(2).replace('\\', '/')
        releaseSigningStorePath = "/mnt/${drive}${relativePath}"
    }
    releaseSigningStoreFile = new File(releaseSigningStorePath)
    releaseSigningConfigured = releaseSigningStoreFile.isFile()
}

android {
    namespace = "net.vipertec.viperchat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.vipertec.viperchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4161222
        versionName "4.16.12-viper.22"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile releaseSigningStoreFile
                storePassword releaseSigningValue('VIPERCHAT_UPLOAD_STORE_PASSWORD')
                keyAlias releaseSigningValue('VIPERCHAT_UPLOAD_KEY_ALIAS')
                keyPassword releaseSigningValue('VIPERCHAT_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel 'symbol_table'
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !releaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set ${releaseSigningKeys.join(', ')} " +
                'or point VIPERCHAT_UPLOAD_ENV_FILE to the private signing .env file.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Firebase pulls DataStore transitively. Keep the stable release that ships
    // native symbol tables so Play Console can symbolicate native crashes.
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
